[project]
name = "capital-markets-research-desk"
version = "2.0.0"
description = "Capital-markets research desk. Agents draft. A citation clerk accepts. No order path."
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40,<2", "pandas>=2.2,<3", "pydantic>=2,<3", "python-dotenv>=1,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ai = ["crewai>=1.0,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
